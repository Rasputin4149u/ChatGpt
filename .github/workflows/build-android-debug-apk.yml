name: Build Android Debug APK

'on':
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-android-debug-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK without local developer environment
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Locate Android project
        id: locate_project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$GITHUB_WORKSPACE/settings.gradle" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            mapfile -t PROJECTS < <(find "$GITHUB_WORKSPACE" -maxdepth 4 -name settings.gradle -not -path '*/.github/*' -print | sort)

            if [ "${#PROJECTS[@]}" -eq 0 ]; then
              echo "ERROR: No settings.gradle found outside .github. Upload build.gradle, settings.gradle, and app/ to the repository root." >&2
              exit 1
            fi

            if [ "${#PROJECTS[@]}" -gt 1 ]; then
              echo "ERROR: More than one settings.gradle found outside .github. Keep only one Android project root." >&2
              printf '%s\n' "${PROJECTS[@]}" >&2
              exit 1
            fi

            PROJECT_DIR="$(dirname "${PROJECTS[0]}")"
          fi

          echo "PROJECT_DIR=${PROJECT_DIR}" | tee -a "$GITHUB_ENV"
          echo "project_dir=${PROJECT_DIR}" >> "$GITHUB_OUTPUT"
          echo "Located Android project at: ${PROJECT_DIR}"

      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/settings.gradle" || { echo "ERROR: Missing settings.gradle" >&2; exit 1; }
          test -f "$PROJECT_DIR/build.gradle" || { echo "ERROR: Missing root build.gradle" >&2; exit 1; }
          test -f "$PROJECT_DIR/app/build.gradle" || { echo "ERROR: Missing app/build.gradle" >&2; exit 1; }
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" || { echo "ERROR: Missing app/src/main/AndroidManifest.xml" >&2; exit 1; }

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --version
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/android-build-log.txt"

      - name: Locate generated APK
        id: locate_apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' -print | sort)

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERROR: Build finished but no debug APK was found." >&2
            exit 1
          fi

          printf 'Generated APK files:\n'
          printf '%s\n' "${APKS[@]}"

      - name: Upload APK and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAccessibilityCopyPasteHelper-debug-apk
          if-no-files-found: warn
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
            android-build-log.txt
            ${{ env.PROJECT_DIR }}/app/build/reports/**
